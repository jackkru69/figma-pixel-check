name: example

on:
  push:
  pull_request:

jobs:
  pixel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: figma-boxes skeleton equals the example's sections file
        working-directory: examples/basic
        run: |
          python3 ../../skills/figma-pixel-check/scripts/figma-boxes.py 1:2 --sections --xml design/figma-metadata.xml > "$RUNNER_TEMP/skeleton.json"
          python3 -c "import json, sys; a, b = (json.load(open(f)) for f in sys.argv[1:]); assert a == b, (a, b)" "$RUNNER_TEMP/skeleton.json" design/sections/profile.json
      - run: npm run example
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-diff
          path: |
            examples/basic/design/diff/
            examples/basic/design/SPACING-AUDIT.md
