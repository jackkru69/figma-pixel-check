<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>colors</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="band swatches" data-section="grays" aria-label="Gray scale">
        <span class="swatch" style="--swatch: var(--gray-50)"></span>
        <span class="swatch" style="--swatch: var(--gray-200)"></span>
        <span class="swatch" style="--swatch: var(--gray-300)"></span>
        <span class="swatch" style="--swatch: var(--gray-400)"></span>
        <span class="swatch" style="--swatch: var(--gray-500)"></span>
        <span class="swatch" style="--swatch: var(--gray-700)"></span>
      </section>

      <section class="band tiles" data-section="near" aria-label="Near grays">
        <span class="tile tile--cool-500"></span>
        <span class="tile tile--cool-400"></span>
      </section>

      <section class="band text-colors" data-section="text-colors">
        <p class="text-primary">Primary text #101828</p>
        <p class="text-secondary">Secondary text #475467</p>
        <p class="text-tertiary">Tertiary text #667085</p>
        <p class="text-brand">Brand text #6941C6</p>
      </section>

      <section class="band" data-section="gradient-linear">
        <div class="gradient gradient--linear"></div>
      </section>

      <section class="band" data-section="gradient-radial">
        <div class="gradient gradient--radial"></div>
      </section>

      <section class="band" data-section="brand">
        <button class="button button--primary" type="button">Continue</button>
      </section>
    </main>
  </body>
</html>
