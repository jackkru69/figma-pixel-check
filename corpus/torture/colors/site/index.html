<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>colors</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="band swatches" data-section="grays" aria-label="Gray scale" data-node-id="2:76">
        <span class="swatch" style="--swatch: var(--gray-50)" data-node-id="2:77"></span>
        <span class="swatch" style="--swatch: var(--gray-200)" data-node-id="2:78"></span>
        <span class="swatch" style="--swatch: var(--gray-300)" data-node-id="2:79"></span>
        <span class="swatch" style="--swatch: var(--gray-400)" data-node-id="2:80"></span>
        <span class="swatch" style="--swatch: var(--gray-500)" data-node-id="2:81"></span>
        <span class="swatch" style="--swatch: var(--gray-700)" data-node-id="2:82"></span>
      </section>

      <section class="band tiles" data-section="near" aria-label="Near grays" data-node-id="2:83">
        <span class="tile tile--cool-500" data-node-id="2:84"></span>
        <span class="tile tile--cool-400" data-node-id="2:85"></span>
      </section>

      <section class="band text-colors" data-section="text-colors" data-node-id="2:86">
        <p class="text-primary">Primary text #101828</p>
        <p class="text-secondary">Secondary text #475467</p>
        <p class="text-tertiary">Tertiary text #667085</p>
        <p class="text-brand">Brand text #6941C6</p>
      </section>

      <section class="band" data-section="gradient-linear" data-node-id="2:91">
        <div class="gradient gradient--linear" data-node-id="2:92"></div>
      </section>

      <section class="band" data-section="gradient-radial" data-node-id="2:93">
        <div class="gradient gradient--radial" data-node-id="2:94"></div>
      </section>

      <section class="band" data-section="brand" data-node-id="2:95">
        <button class="button button--primary" type="button" data-node-id="2:96">Continue</button>
      </section>
    </main>
  </body>
</html>
