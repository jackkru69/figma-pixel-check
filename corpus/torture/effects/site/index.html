<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>effects</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="band" data-section="shadow-sm" data-node-id="2:56">
        <div class="card card--sm" data-node-id="2:57"><p class="label">Shadow sm · 0 1 3 / 0 1 2</p></div>
      </section>
      <section class="band" data-section="shadow-lg" data-node-id="2:59">
        <div class="card card--lg" data-node-id="2:60"><p class="label">Shadow lg · 0 12 16 −4 / 0 4 6 −2</p></div>
      </section>
      <section class="band" data-section="inner" data-node-id="2:62">
        <div class="card card--inner" data-node-id="2:63"><p class="label">Inner shadow · 0 2 4</p></div>
      </section>
      <section class="band" data-section="blur" data-node-id="2:65">
        <div class="blur-row" aria-hidden="true" data-node-id="2:66">
          <span class="dot" data-node-id="2:67"></span>
          <span class="dot dot--blur-8" data-node-id="2:68"></span>
          <span class="dot dot--blur-16" data-node-id="2:69"></span>
        </div>
      </section>
      <section class="band" data-section="glass" data-node-id="2:70">
        <div class="stage" data-node-id="2:71">
          <span class="blob" aria-hidden="true" data-node-id="2:72"></span>
          <div class="glass-card" data-section="glass-card" data-node-id="2:73"><p class="label label--glass">Glass · background blur 12</p></div>
        </div>
      </section>
    </main>
  </body>
</html>
