<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fractional</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <header class="band" data-section="half-band">
        <p class="band__title">Band of 48.5 px</p>
      </header>

      <section class="half-box" data-section="half-box">
        <div class="swatch"></div>
      </section>

      <section class="hairline" data-section="hairline">
        <hr class="hairline__rule" />
        <p class="hairline__text">Under a 0.5 px hairline</p>
      </section>

      <section class="copy" data-section="odd-line-height">
        <p class="copy__text">Two lines of text with a line height of 21.5 px, which rounds differently in every engine.</p>
      </section>

      <section class="icons" data-section="icon-strokes">
        <img class="icon icon--20" src="assets/66960.svg" alt="" />
        <img class="icon" src="assets/c79fa.svg" alt="" />
        <img class="icon" src="assets/6b23f.svg" alt="" />
        <img class="icon" src="assets/91236.svg" alt="" />
      </section>

      <section class="stats" data-section="half-grid">
        <article class="stat">
          <p class="stat__label">Income</p>
          <p class="stat__value">$4,280.50</p>
        </article>
        <article class="stat">
          <p class="stat__label">Expenses</p>
          <p class="stat__value">$1,932.17</p>
        </article>
      </section>
    </main>
  </body>
</html>
