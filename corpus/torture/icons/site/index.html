<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>icons</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <div class="icon-row icon-row--16" data-section="stroke-16">
        <img class="icon" src="assets/search-16.svg" alt="Search" />
        <img class="icon" src="assets/heart-16.svg" alt="Like" />
        <img class="icon" src="assets/settings-16.svg" alt="Settings" />
        <img class="icon" src="assets/send-16.svg" alt="Send" />
        <img class="icon" src="assets/calendar-16.svg" alt="Calendar" />
        <img class="icon" src="assets/check-16.svg" alt="Done" />
      </div>

      <div class="icon-row icon-row--20" data-section="stroke-20">
        <img class="icon" src="assets/search-20.svg" alt="Search" />
        <img class="icon" src="assets/heart-20.svg" alt="Like" />
        <img class="icon" src="assets/settings-20.svg" alt="Settings" />
        <img class="icon" src="assets/send-20.svg" alt="Send" />
        <img class="icon" src="assets/calendar-20.svg" alt="Calendar" />
        <img class="icon" src="assets/check-20.svg" alt="Done" />
      </div>

      <div class="icon-row icon-row--24" data-section="stroke-24">
        <img class="icon" src="assets/search-24.svg" alt="Search" />
        <img class="icon" src="assets/heart-24.svg" alt="Like" />
        <img class="icon" src="assets/settings-24.svg" alt="Settings" />
        <img class="icon" src="assets/send-24.svg" alt="Send" />
        <img class="icon" src="assets/calendar-24.svg" alt="Calendar" />
        <img class="icon" src="assets/check-24.svg" alt="Done" />
      </div>

      <div class="icon-row icon-row--32" data-section="stroke-32">
        <img class="icon" src="assets/search-32.svg" alt="Search" />
        <img class="icon" src="assets/heart-32.svg" alt="Like" />
        <img class="icon" src="assets/settings-32.svg" alt="Settings" />
        <img class="icon" src="assets/send-32.svg" alt="Send" />
        <img class="icon" src="assets/calendar-32.svg" alt="Calendar" />
        <img class="icon" src="assets/check-32.svg" alt="Done" />
      </div>

      <div class="icon-row icon-row--24" data-section="filled">
        <img class="icon" src="assets/filled-1.svg" alt="Favourite" />
        <img class="icon" src="assets/filled-2.svg" alt="Liked" />
        <img class="icon" src="assets/filled-3.svg" alt="Online" />
      </div>

      <div class="icon-row icon-row--buttons" data-section="icon-buttons">
        <button type="button" class="icon-button icon-button--soft" aria-label="Send">
          <img class="icon" src="assets/button-1.svg" alt="" />
        </button>
        <button type="button" class="icon-button icon-button--outline" aria-label="Search">
          <img class="icon" src="assets/button-2.svg" alt="" />
        </button>
        <button type="button" class="icon-button icon-button--solid" aria-label="Confirm">
          <img class="icon" src="assets/button-3.svg" alt="" />
        </button>
      </div>
    </main>
  </body>
</html>
