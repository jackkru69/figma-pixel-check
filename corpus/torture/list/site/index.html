<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>list</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <h2 class="group-title" data-section="header" data-node-id="2:161">Account</h2>

      <ul class="settings" data-section="rows" data-node-id="2:163">
        <li>
          <a class="row" data-node-id="2:164" href="#notifications">
            <img class="row-icon" data-node-id="2:165" src="assets/bell.svg" width="24" height="24" alt="" />
            <span class="row-title">Notifications</span>
            <span class="row-value">On</span>
            <img class="row-chevron" data-node-id="2:169" src="assets/chevron.svg" width="20" height="20" alt="" />
          </a>
        </li>
        <li data-node-id-before="2:172">
          <a class="row" data-node-id="2:173" href="#privacy">
            <img class="row-icon" data-node-id="2:174" src="assets/lock.svg" width="24" height="24" alt="" />
            <span class="row-title">Privacy and security</span>
            <img class="row-chevron" data-node-id="2:177" src="assets/chevron.svg" width="20" height="20" alt="" />
          </a>
        </li>
        <li data-node-id-before="2:180">
          <a class="row" data-node-id="2:181" href="#payment-methods">
            <img class="row-icon" data-node-id="2:182" src="assets/card.svg" width="24" height="24" alt="" />
            <span class="row-title">Payment methods</span>
            <span class="row-value">2 cards</span>
            <img class="row-chevron" data-node-id="2:186" src="assets/chevron.svg" width="20" height="20" alt="" />
          </a>
        </li>
        <li data-node-id-before="2:189">
          <a class="row" data-node-id="2:190" href="#language">
            <img class="row-icon" data-node-id="2:191" src="assets/globe.svg" width="24" height="24" alt="" />
            <span class="row-title">Language</span>
            <span class="row-value">English</span>
            <img class="row-chevron" data-node-id="2:195" src="assets/chevron.svg" width="20" height="20" alt="" />
          </a>
        </li>
      </ul>

      <nav class="chips" aria-label="Filter" data-section="chips" data-node-id="2:197">
        <a class="chip is-active" data-node-id="2:199" href="#all" aria-current="true">All</a>
        <a class="chip" data-node-id="2:201" href="#transfers">Transfers</a>
        <a class="chip" data-node-id="2:203" href="#card-payments">Card payments</a>
        <a class="chip" data-node-id="2:205" href="#subscriptions">Subscriptions</a>
        <a class="chip" data-node-id="2:207" href="#cashback">Cashback</a>
      </nav>

      <footer class="account-note" data-section="full-divider" data-node-id="2:209">
        <p>Signed in as alex@example.com</p>
      </footer>
    </main>
  </body>
</html>
