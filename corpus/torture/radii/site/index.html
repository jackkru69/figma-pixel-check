<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radii</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="scale" data-section="radius-scale" data-node-id="2:125">
        <div class="swatch swatch--4" data-node-id="2:126"></div>
        <div class="swatch swatch--8" data-node-id="2:127"></div>
        <div class="swatch swatch--16" data-node-id="2:128"></div>
        <div class="swatch swatch--28" data-node-id="2:129"></div>
        <span class="pill" data-node-id="2:130">Pill</span>
      </section>

      <section class="sheet-top" data-section="sheet-top" data-node-id="2:132">
        <div class="sheet" data-node-id="2:133">
          <div class="sheet__handle" data-node-id="2:134"></div>
          <h2 class="sheet__title">Bottom sheet with top radius 24</h2>
        </div>
      </section>

      <section class="smoothing" data-section="smoothing" data-node-id="2:136">
        <div class="tile" data-node-id="2:137"></div>
        <div class="tile tile--smooth" data-node-id="2:138"></div>
      </section>

      <section class="clip" data-section="clip" data-node-id="2:139">
        <div class="mask" aria-hidden="true" data-node-id="2:140">
          <span class="mask__disc" data-node-id="2:141"></span>
          <span class="mask__bar" data-node-id="2:142"></span>
          <span class="mask__dot" data-node-id="2:143"></span>
        </div>
      </section>
    </main>
  </body>
</html>
