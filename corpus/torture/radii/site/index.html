<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radii</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="scale" data-section="radius-scale">
        <div class="swatch swatch--4"></div>
        <div class="swatch swatch--8"></div>
        <div class="swatch swatch--16"></div>
        <div class="swatch swatch--28"></div>
        <span class="pill">Pill</span>
      </section>

      <section class="sheet-top" data-section="sheet-top">
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="sheet__title">Bottom sheet with top radius 24</h2>
        </div>
      </section>

      <section class="smoothing" data-section="smoothing">
        <div class="tile"></div>
        <div class="tile tile--smooth"></div>
      </section>

      <section class="clip" data-section="clip">
        <div class="mask" aria-hidden="true">
          <span class="mask__disc"></span>
          <span class="mask__bar"></span>
          <span class="mask__dot"></span>
        </div>
      </section>
    </main>
  </body>
</html>
