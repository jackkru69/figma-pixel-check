<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>strokes</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="band" data-section="inside" data-node-id="2:3">
        <div class="card card--inside" data-node-id="2:4"><p class="label">Inside stroke · 1 px</p></div>
      </section>
      <section class="band" data-section="center" data-node-id="2:6">
        <div class="card card--center" data-node-id="2:7"><p class="label">Center stroke · 2 px</p></div>
      </section>
      <section class="band" data-section="outside" data-node-id="2:9">
        <div class="card card--outside" data-node-id="2:10"><p class="label">Outside stroke · 2 px</p></div>
      </section>
      <section class="band" data-section="dashed" data-node-id="2:12">
        <div class="card card--dashed" data-node-id="2:13"><p class="label">Dashed · 1 px · 4/4</p></div>
      </section>
      <section class="band" data-section="thick" data-node-id="2:15">
        <div class="card card--thick" data-node-id="2:16"><p class="label">Inside · 2 px · radius 16</p></div>
      </section>
    </main>
  </body>
</html>
