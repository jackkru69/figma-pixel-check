<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>strokes</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <section class="band" data-section="inside">
        <div class="card card--inside"><p class="label">Inside stroke · 1 px</p></div>
      </section>
      <section class="band" data-section="center">
        <div class="card card--center"><p class="label">Center stroke · 2 px</p></div>
      </section>
      <section class="band" data-section="outside">
        <div class="card card--outside"><p class="label">Outside stroke · 2 px</p></div>
      </section>
      <section class="band" data-section="dashed">
        <div class="card card--dashed"><p class="label">Dashed · 1 px · 4/4</p></div>
      </section>
      <section class="band" data-section="thick">
        <div class="card card--thick"><p class="label">Inside · 2 px · radius 16</p></div>
      </section>
    </main>
  </body>
</html>
